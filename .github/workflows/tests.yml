name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Check public history and identity
        run: python scripts/audit_public_repo.py --name "Hut auf" --email "13893694+hutauf@users.noreply.github.com"
