name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Fresh setup and restore with synthetic data
        run: python scripts/release_smoke.py --output "${{ runner.temp }}/bookkeeping-release-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/bookkeeping-release-smoke/report.json
      - name: Check public history and identity
        if: always()
        run: python scripts/audit_public_repo.py --name "hutauf" --email "13893694+hutauf@users.noreply.github.com"
